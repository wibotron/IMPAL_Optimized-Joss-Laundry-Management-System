{% extends 'base.html' %}
{% block title %}Beri Feedback{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-bold mb-2">Beri Feedback</h1>
        <p class="text-gray-600 mb-6">Untuk pesanan: <strong>{{ order.kode_nota }}</strong></p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3">
                <button type="submit" class="bg-brand-red text-white px-4 py-2 rounded-lg hover:bg-red-700">Kirim Feedback</button>
                <a href="{% url 'orders:customer_dashboard' %}" class="bg-gray-300 px-4 py-2 rounded-lg hover:bg-gray-400">Batal</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.querySelectorAll('select, textarea').forEach(el => {
        el.classList.add('w-full', 'px-3', 'py-2', 'border', 'border-gray-300', 'rounded-lg', 'focus:ring-2', 'focus:ring-brand-red');
    });
</script>
{% endblock %}
