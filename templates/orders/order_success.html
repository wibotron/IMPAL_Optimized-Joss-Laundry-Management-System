{% extends 'base.html' %}
{% block title %}Order Berhasil{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-white rounded-xl shadow p-8">
        <div class="text-6xl mb-4">✅</div>
        <h1 class="text-2xl font-bold mb-2">Pesanan Berhasil!</h1>
        <p class="text-gray-600 mb-4">Kode Nota: <strong class="font-mono">{{ order.kode_nota }}</strong></p>
        <p class="text-gray-600 mb-4">Total: <strong>Rp {{ order.total_harga|floatformat:0 }}</strong></p>
        <a href="{{ wa_link }}" target="_blank" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 mb-4">Kirim WhatsApp ke Customer</a>
        <div>
            <a href="{% url 'orders:order_list_karyawan' %}" class="text-brand-red hover:underline">Kembali ke Daftar Order</a>
        </div>
    </div>
</div>
{% endblock %}
