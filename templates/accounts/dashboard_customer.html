{% extends 'base.html' %}
{% block title %}Customer Dashboard{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold">Halo, {{ user.full_name }}! 👋</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
        <a href="{% url 'orders:claim_order' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">📦</div>
            <h3 class="font-bold mt-2">Klaim Pesanan</h3>
            <p class="text-sm text-gray-500">Masukkan kode nota</p>
        </a>
        <a href="{% url 'orders:customer_dashboard' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">📊</div>
            <h3 class="font-bold mt-2">Status Progress</h3>
            <p class="text-sm text-gray-500">Lihat riwayat pesanan</p>
        </a>
        <a href="{% url 'orders:customer_dashboard' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">📄</div>
            <h3 class="font-bold mt-2">Unduh Nota</h3>
            <p class="text-sm text-gray-500">Setelah lunas</p>
        </a>
        <a href="{% url 'orders:customer_dashboard' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">💬</div>
            <h3 class="font-bold mt-2">Beri Feedback</h3>
            <p class="text-sm text-gray-500">Untuk pesanan lunas</p>
        </a>
    </div>
</div>
{% endblock %}
