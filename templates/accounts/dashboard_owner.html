{% extends 'base.html' %}
{% block title %}Owner Dashboard{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold">Owner Command Center</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
        <a href="{% url 'packages:package_list' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">🏷️</div>
            <h3 class="font-bold">Paket Laundry</h3>
            <p class="text-sm text-gray-500">Tambah/edit paket</p>
        </a>
        <a href="{% url 'accounts:karyawan_list' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">👥</div>
            <h3 class="font-bold">Manajemen Karyawan</h3>
            <p class="text-sm text-gray-500">CRUD karyawan</p>
        </a>
        <a href="{% url 'reports:dashboard' %}" class="bg-white p-6 rounded-xl shadow text-center hover:shadow-lg transition">
            <div class="text-4xl text-brand-red">📈</div>
            <h3 class="font-bold">Business Reports</h3>
            <p class="text-sm text-gray-500">Laporan & statistik</p>
        </a>
    </div>
</div>
{% endblock %}
