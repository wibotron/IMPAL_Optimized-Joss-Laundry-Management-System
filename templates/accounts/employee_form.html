{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm font-bold mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-xs">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3">
                <button type="submit" class="bg-brand-red text-white px-4 py-2 rounded-lg">Simpan</button>
                <a href="{% url 'employee_list' %}" class="bg-gray-300 px-4 py-2 rounded-lg">Batal</a>
            </div>
        </form>
    </div>
</div>
<script>document.querySelectorAll('input, textarea, select').forEach(el=>{if(el.type!=='submit')el.classList.add('w-full','px-3','py-2','border','border-gray-300','rounded-lg','focus:ring-2','focus:ring-brand-red')});</script>
{% endblock %}
